 influence_award_notification: "As an Administrative ruler grants [influence_i][influence|E] proportionate to title rank if granted as [feudal_i|E][feudal|E],[clan_i|E][clan|E], or [theocracy_i|E][theocratic|E] Government:\n-[influence_i] 250 [influence|E] for Empire tier.\n-[influence_i] 150 [influence|E] for Kingdom tier.\n-[influence_i] 100 [influence|E] for Duchy tier.\n-[influence_i] 60 [influence|E] for County tier.\n\nAs an Administrative ruler grants [gold_i][gold|E] proportionate to title rank if granted as feudal or theocratic:\n-[gold_i] A monumental volume of [gold|E] for Empire tier.\n-[gold_i] A massive volume of [gold|E] for Kingdom tier.\n-[gold_i] A major volume of [gold|E] for Duchy tier.\n-[gold_i] A moderate volume of [gold|E] for County tier.\n\nNOTICE\n[feudal_i|E][feudal|E] & [clan_i|E][clan|E] rulers created via this method will have a 50 year grace period where they will not convert to an Administrative Government.\nIf by the end of this grace period the vassal is [GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L](Or greater) or [GetModifier( 'piety_level_3' ).GetNameWithTooltip|L](Or greater) or [GetModifier( 'dynasty_prestige_level_3' ).GetNameWithTooltip|L](Or greater) they will remain [feudal_i|E][feudal|E] or [clan_i|E][clan|E]."
 
