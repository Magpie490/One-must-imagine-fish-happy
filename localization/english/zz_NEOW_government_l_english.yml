l_english: 

 # Administrative
 administrative_themes_king: "Available Administration Types"
 admin_theme_balanced_king: "@balanced_administration! Balanced Administration"
 admin_theme_balanced_king_short: "@balanced_administration! Balanced"
 admin_theme_balanced_king_text_icon: "@balanced_administration!"
 admin_theme_balanced_king_desc: "#flavor A well balanced administration seeks moderation to ensure equal attention in all areas of governance.#!"
 admin_theme_military_king: "@military_administration! Military Administration"
 admin_theme_military_king_short: "@military_administration! Military"
 admin_theme_military_king_text_icon: "@military_administration!"
 admin_theme_military_king_benefits: "#emphasis #bold [vassal|E] Benefits:#!#!\n$EFFECT_LIST_BULLET$ Increases [governor_efficiency|E] based on [martial|E]#indent_newline:4 \n#weak Adds an extra [EmptyScope.ScriptValue('efficiency_skill_increase_value')|+1%/] for each [skill|E] Point#!#!"
 admin_theme_military_king_desc: "#flavor A military administration puts all energy on recruiting and training formidable troops for the imperial army.#!"
 admin_theme_civilian_king: "@civilian_administration! Civilian Administration"
 admin_theme_civilian_king_short: "@civilian_administration! Civilian"
 admin_theme_civilian_king_text_icon: "@civilian_administration!"
 admin_theme_civilian_king_benefits: "#emphasis #bold [vassal|E] Benefits:#!#!\n$EFFECT_LIST_BULLET$ Increases [governor_efficiency|E] based on [stewardship|E]#indent_newline:4 \n#weak Adds an extra [EmptyScope.ScriptValue('efficiency_skill_increase_value')|+1%/] for each [skill|E] Point#!#!\n[influence|E] gained from constructing [buildings|E] in held [counties|E] is increased"
 admin_theme_civilian_king_desc: "#flavor Exempt from military service, a civilian administration focuses on improving the economy and well-being of the citizens.#!"
 admin_theme_frontier_king: "@frontier_administration! Frontier Administration"
 admin_theme_frontier_king_short: "@frontier_administration! Frontier"
 admin_theme_frontier_king_text_icon: "@frontier_administration!"
 admin_theme_frontier_king_benefits: "#emphasis #bold [liege|E] Benefits:#!#!\n$EFFECT_LIST_BULLET$ Unlocks the #high $frontier_influence_war_interaction$#! [interaction|E] allowing the liege to request the [vassal|E] to declare war for a foreign [duchy|E]-tier [title|E]\n\n#emphasis #bold [vassal|E] Benefits:#!#!\n$EFFECT_LIST_BULLET$ Increases [governor_efficiency|E] based on [prowess|E]#indent_newline:4 \n#weak Adds an extra [EmptyScope.ScriptValue('efficiency_skill_increase_value')|+1%/] for each [skill|E] Point#!#!\n$EFFECT_LIST_BULLET$ Unlocks the #high $EXPANSION_DUCHY_CB_NAME$#! [casus_belli|E]\n$EFFECT_LIST_BULLET$ Enables [raiding|E]"
 admin_theme_frontier_king_desc: "#flavor One cannot leave the borders undefended. A frontier administration will ensure the realm's defenses and stand ready to repel any potential invaders.#!"
 admin_theme_imperial_king: "@imperial_administration! Imperial Administration"
 admin_theme_imperial_king_short: "@imperial_administration! Imperial"
 admin_theme_imperial_king_text_icon: "@imperial_administration!"
 admin_theme_imperial_king_benefits: "#emphasis #bold [vassal|E] Benefits:#!#!\n$EFFECT_LIST_BULLET$ Increases [governor_efficiency|E] based on [prestige_level|E]#indent_newline:4 \n#weak Adds an extra [EmptyScope.ScriptValue('efficiency_currency_level_increase_value')|+0%/] for each level#!#!\n$EFFECT_LIST_BULLET$ Increases [powerful_family|E] Rating\nCannot have appointment revoked without a [revoke_title_reason|E]"
 admin_theme_imperial_king_desc: "#flavor An imperial administration provides a significant level of autonomy and freedom from many regular responsibilities. It is the most prestigious administration one can have.#!"
 admin_theme_naval_king: "@naval_administration! Naval Administration"
 admin_theme_naval_king_short: "@naval_administration! Naval"
 admin_theme_naval_king_text_icon: "@naval_administration!"
 admin_theme_naval_king_benefits: "#emphasis #bold [liege|E] Benefits:#!#!\n$EFFECT_LIST_BULLET$ Unlocks the #high $frontier_influence_war_interaction$#! [interaction|E] allowing the liege to request the [vassal|E] to declare war for a foreign [duchy|E]-tier [title|E]\n\n#emphasis #bold [vassal|E] Benefits:#!#!\n$EFFECT_LIST_BULLET$ Increases [governor_efficiency|E] for every controlled #high [GetBuilding('common_tradeport_01').GetTypeName]#!#indent_newline:4 \n#weak Adds an extra [EmptyScope.ScriptValue('efficiency_building_increase_value')|+0%/] for each [GetBuilding('common_tradeport_01').GetTypeName]#!#!\n$EFFECT_LIST_BULLET$ Unlocks the #high $NAVAL_EXPANSION_DUCHY_CB_NAME$#! [casus_belli|E]"
 admin_theme_naval_king_desc: "#flavor The navy is the backbone of any expansive realm. With a dedicated naval administration, safety and efficiency at sea will be highly increased.#!"
